apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:
      - job_name: "autoheal-app"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "autoheal-app-service.default.svc.cluster.local:80"
