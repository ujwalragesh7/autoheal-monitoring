apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
data:
  alerts.yml: |
    groups:
      - name: autoheal-alerts
        rules:

          - alert: AutoHealApplicationDown
            expr: up{job="autoheal-app"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "AutoHeal application is down"
              description: "Prometheus cannot reach the AutoHeal application."

          - alert: AutoHealHighCPU
            expr: rate(process_cpu_seconds_total[5m]) > 0.8
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "AutoHeal CPU usage is high"
              description: "Application CPU usage has exceeded the configured threshold."

          - alert: AutoHealHighMemory
            expr: process_resident_memory_bytes > 100000000
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "AutoHeal memory usage is high"
              description: "Application memory usage has exceeded 100 MB."
