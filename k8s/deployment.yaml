apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoheal-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autoheal-app
  template:
    metadata:
      labels:
        app: autoheal-app
    spec:
      containers:
        - name: autoheal-app
          image: autoheal-monitoring:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
